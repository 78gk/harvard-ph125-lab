name: Run analysis scripts

on:
  push:
    branches: [ master, section7-start ]
  pull_request:
    branches: [ master ]

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libssl-dev libcurl4-openssl-dev

      - name: Install renv
        run: Rscript -e "install.packages('renv', repos='https://cloud.r-project.org')"

      - name: Restore R packages via renv
        run: Rscript -e "if (file.exists('renv.lock')) renv::restore() else message('No renv.lock found; skipping restore')"

      - name: Run analysis scripts (via run_all.ps1 using Rscript)
        run: |
          # Use Rscript directly to run scripts (PowerShell runner not required on Linux)
          Rscript -e "source('renv/activate.R'); source('scripts/section6_answers.R')" || true
          Rscript -e "source('renv/activate.R'); source('scripts/movielens_section_answers.R')" || true
          Rscript -e "source('renv/activate.R'); source('scripts/schools_regularization_answers.R')" || true
          Rscript -e "source('renv/activate.R'); source('scripts/svd_q3_compute.R')" || true

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: |
            outputs/figures/**
            outputs/answers_summary.csv
